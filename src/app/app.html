<div class="app-layout">
  <!-- 1. Barra de navegación común / Navbar -->
  <header class="app-navbar">
    <div class="nav-container">
      <a routerLink="/" class="nav-brand">
        🎬 <span>Mi Cine</span>
      </a>

      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      </nav>

      <div class="nav-auth">
        @if (authService.isLoggedIn()) {
          <span class="user-greeting">
            Hola, <strong>{{ authService.currentProfile()?.nombre || 'Usuario' }}</strong>
          </span>
          <button type="button" class="btn-nav btn-logout" (click)="cerrarSesion()">
            Cerrar Sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn-nav btn-login">
            Iniciar Sesión
          </a>
        }
      </div>
    </div>
  </header>

  <!-- 2. Contenido dinámico según la ruta activa -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- 3. Pie de página común / Footer -->
  <footer class="app-footer">
    <p>© 2026 Sistema de Cine - TP Programación IV - Proyecto realizado por Lucas Di Crocco</p>
  </footer>
</div>
