<form (submit)="onSubmit($event)" class="register-form">
  <h3>Registrarse</h3>

  <div class="form-group">
    <label for="register-nombre">Nombre</label>
    <input
      id="register-nombre"
      type="text"
      name="nombre"
      [(ngModel)]="nombre"
      placeholder="Tu nombre"
      required
      [disabled]="isLoading()"
    />
  </div>

  <div class="form-group">
    <label for="register-apellido">Apellido</label>
    <input
      id="register-apellido"
      type="text"
      name="apellido"
      [(ngModel)]="apellido"
      placeholder="Tu apellido"
      required
      [disabled]="isLoading()"
    />
  </div>

  <div class="form-group">
    <label for="register-email">Email</label>
    <input
      id="register-email"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="correo@ejemplo.com"
      required
      [disabled]="isLoading()"
    />
  </div>

  <div class="form-group">
    <label for="register-password">Contraseña</label>
    <input
      id="register-password"
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Mínimo 6 caracteres"
      required
      [disabled]="isLoading()"
    />
  </div>

  <div class="form-group">
    <label for="register-fecha">Fecha de Nacimiento</label>
    <input
      id="register-fecha"
      type="date"
      name="fechaNacimiento"
      [(ngModel)]="fechaNacimiento"
      required
      [disabled]="isLoading()"
    />
  </div>

  <button type="submit" [disabled]="isLoading()" class="btn-submit">
    @if (isLoading()) {
      Creando cuenta...
    } @else {
      Registrarme
    }
  </button>
</form>
