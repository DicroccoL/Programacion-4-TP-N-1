<div class="fecha-control" [class.deshabilitado]="deshabilitado || bloqueado" role="group" aria-label="Fecha">
  <input type="text" inputmode="numeric" maxlength="2" placeholder="00" aria-label="Día" [value]="dia"
    [disabled]="deshabilitado || bloqueado" (input)="escribir('dia', $event)" (focus)="$any($event.target).select()" (blur)="tocar()">
  <span aria-hidden="true">/</span>
  <input type="text" inputmode="numeric" maxlength="2" placeholder="00" aria-label="Mes" [value]="mes"
    [disabled]="deshabilitado || bloqueado" (input)="escribir('mes', $event)" (focus)="$any($event.target).select()" (blur)="tocar()">
  <span aria-hidden="true">/</span>
  <input class="anio" type="text" inputmode="numeric" maxlength="4" placeholder="2000" aria-label="Año" [value]="anio"
    [disabled]="deshabilitado || bloqueado" (input)="escribir('anio', $event)" (focus)="$any($event.target).select()" (blur)="tocar()">
</div>
